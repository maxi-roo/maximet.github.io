<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Weather - Fix CORS</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #111827;
            --card: #1f2937;
            --text: #f3f4f6;
            --accent: #10b981;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 850px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #374151;
        }

        input[type="text"], select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #4b5563;
            background: #111827;
            color: white;
            outline: none;
        }

        input[type="text"] { width: 100px; text-transform: uppercase; font-weight: bold; text-align: center; }

        .checkbox-group {
            display: flex;
            gap: 15px;
            padding: 0 10px;
        }

        .btn-group { display: flex; gap: 8px; }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn-load { background-color: var(--primary); color: white; }
        .btn-load:hover { background-color: #2563eb; }

        .btn-raw { background-color: #4b5563; color: white; }
        .btn-raw:hover { background-color: #6b7280; }

        #output {
            background: #000;
            color: var(--accent);
            padding: 20px;
            border-radius: 6px;
            min-height: 120px;
            white-space: pre-wrap;
            font-family: 'Consolas', 'Monaco', monospace;
            border: 1px solid #374151;
            margin-top: 20px;
            line-height: 1.5;
        }

        .status-bar {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0">✈️ Aeronautical Data Viewer</h2>
    
    <div class="controls">
        <input type="text" id="icao" placeholder="ICAO" maxlength="4" value="GCXO">
        
        <select id="hours">
            <option value="0">Más reciente</option>
            <option value="2">Últimas 2h</option>
            <option value="6">Últimas 6h</option>
        </select>

        <div class="checkbox-group">
            <label><input type="checkbox" id="checkMetar" checked disabled> METAR</label>
            <label><input type="checkbox" id="checkTaf"> TAF</label>
        </div>

        <div class="btn-group">
            <button class="btn-load" onclick="fetchData(false)">Cargar</button>
            <button class="btn-raw" onclick="fetchData(true)">Raw</button>
        </div>
    </div>

    <div id="output">Introduce un código ICAO y pulsa Cargar...</div>
    <div class="status-bar">
        <span id="urlDisplay">Esperando acción...</span>
    </div>
</div>

<script>
    async function fetchData(isRawMode) {
        const icao = document.getElementById('icao').value.trim().toUpperCase();
        const hours = document.getElementById('hours').value;
        const tafActive = document.getElementById('checkTaf').checked;
        const output = document.getElementById('output');
        const urlDisplay = document.getElementById('urlDisplay');

        if (!icao) {
            alert("Introduce un código ICAO válido (ej. LEBL, GCXO).");
            return;
        }

        // Construcción de la URL original
        const targetUrl = `https://aviationweather.gov/api/data/metar?ids=${icao}&format=raw&taf=${tafActive}&hours=${hours}`;
        
        // Uso de proxy para evitar error CORS
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        
        urlDisplay.innerText = `Consultando: ${targetUrl}`;
        output.innerText = "Consultando servidor meteorológico...";

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error("Error en la conexión.");
            
            const json = await response.json();
            // AllOrigins devuelve el contenido en la propiedad 'contents'
            const data = json.contents;
            
            if (!data || data.trim() === "") {
                output.innerText = "No hay datos disponibles para esta estación en este momento.";
            } else {
                output.innerText = data;
            }

        } catch (error) {
            output.innerText = "Error: No se pudo conectar con el servicio. " + error.message;
            console.error(error);
        }
    }
</script>

</body>
</html>
