<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Weather - Reporte Profesional</title>
    <style>
        :root {
            --primary: #3b82f6;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #10b981;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 850px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        input[type="text"], select {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        input[type="text"] { width: 100px; text-transform: uppercase; font-weight: 700; text-align: center; }

        .checkbox-group {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
        }

        .btn-group { display: flex; gap: 10px; }

        button {
            padding: 10px 22px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-load { background-color: var(--primary); color: white; }
        .btn-load:hover { background-color: #2563eb; }

        .btn-raw { background-color: #475569; color: white; }

        #output {
            background: #000;
            color: #f8fafc;
            padding: 25px;
            border-radius: 8px;
            min-height: 120px;
            white-space: pre-wrap;
            font-family: 'Consolas', 'Monaco', monospace;
            border: 1px solid #334155;
            line-height: 1.6;
            font-size: 1.1rem;
        }

        .info-bar {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #94a3b8;
            margin-top: 15px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 style="margin-top:0">✈️ METAR & TAF Viewer</h2>
    
    <div class="controls">
        <input type="text" id="icao" placeholder="ICAO" maxlength="4" value="GCXO">
        
        <select id="hours">
            <option value="0">Más reciente</option>
            <option value="3">Últimas 3h</option>
            <option value="6">Últimas 6h</option>
            <option value="12">Últimas 12h</option>
        </select>

        <div class="checkbox-group">
            <label><input type="checkbox" id="checkMetar" checked disabled> METAR</label>
            <label><input type="checkbox" id="checkTaf"> TAF</label>
        </div>

        <div class="btn-group">
            <button class="btn-load" onclick="fetchData()">Cargar</button>
            <button class="btn-raw" onclick="openRaw()">Raw</button>
        </div>
    </div>

    <div id="output">Introduce el ICAO y pulsa Cargar...</div>
    
    <div class="info-bar">
        <span id="lastUpdate">Esperando primera carga...</span>
    </div>
</div>

<script>
    function buildUrl() {
        const icao = document.getElementById('icao').value.trim().toUpperCase();
        const hours = document.getElementById('hours').value;
        const tafActive = document.getElementById('checkTaf').checked;
        return `https://aviationweather.gov/api/data/metar?ids=${icao}&format=raw&taf=${tafActive}&hours=${hours}`;
    }

    async function fetchData() {
        const output = document.getElementById('output');
        const lastUpdateLabel = document.getElementById('lastUpdate');
        const icao = document.getElementById('icao').value.trim();
        
        if (!icao) return;

        const targetUrl = buildUrl();
        // Usamos allorigins para evitar CORS y añadimos un timestamp para evitar caché
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}&ts=${Date.now()}`;

        try {
            const response = await fetch(proxyUrl);
            const json = await response.json();
            let data = json.contents;

            if (!data || data.trim() === "") {
                output.innerText = "No hay datos disponibles para la estación " + icao.toUpperCase();
            } else {
                // Lógica de separación: añadir doble salto de línea antes de cada TAF
                // Usamos una expresión regular para que sea robusto
                if (data.includes("TAF")) {
                    data = data.replace(/TAF/g, "\n\nTAF");
                    // Limpiamos posibles triples saltos de línea generados
                    data = data.replace(/\n\n\n/g, "\n\n");
                }
                output.innerText = data.trim();
            }
            
            // Formatear la fecha y hora según tu solicitud
            const ahora = new Date();
            const hora = ahora.toLocaleTimeString('es-ES', { hour12: false });
            const dia = ahora.getDate().toString().padStart(2, '0');
            const mes = ahora.toLocaleDateString('es-ES', { month: 'long' });
            const anio = ahora.getFullYear();

            lastUpdateLabel.innerText = `Ultima actualización: ${hora} el ${dia} ${mes} ${anio}`;
            
        } catch (error) {
            console.error(error);
            lastUpdateLabel.innerText = "Error al intentar actualizar los datos.";
        }
    }

    function openRaw() {
        window.open(buildUrl(), '_blank');
    }

    // Refresco automático cada 5 minutos
    setInterval(fetchData, 300000); 

    // Carga inicial
    window.onload = () => {
        if(document.getElementById('icao').value) fetchData();
    };
</script>

</body>
</html>
