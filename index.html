<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Weather Fetcher</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --accent: #38bdf8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background-color: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
        }

        h2 { margin-top: 0; color: var(--accent); font-weight: 300; }

        /* Controles superiores */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 8px;
        }

        input[type="text"], select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            outline: none;
        }

        input[type="text"] { width: 120px; text-transform: uppercase; font-weight: bold; }

        .checkbox-group {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 0.9rem;
        }

        /* Botones */
        .btn-group { display: flex; gap: 10px; }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-load { background-color: var(--primary); color: white; }
        .btn-load:hover { background-color: #1d4ed8; }

        .btn-raw { background-color: #475569; color: white; }
        .btn-raw:hover { background-color: #64748b; }

        /* Área de resultados */
        #output {
            background: #000;
            color: #10b981;
            padding: 15px;
            border-radius: 6px;
            min-height: 100px;
            white-space: pre-wrap;
            font-family: 'Courier New', Courier, monospace;
            border: 1px solid #1e293b;
            margin-top: 20px;
        }

        .url-debug {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 10px;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Consulta Aeronáutica</h2>
    
    <div class="controls">
        <input type="text" id="icao" placeholder="ICAO (Ej: GCXO)" maxlength="4">
        
        <select id="hours">
            <option value="0">Más reciente</option>
            <option value="2">Últimas 2h</option>
            <option value="6">Últimas 6h</option>
            <option value="24">Últimas 24h</option>
        </select>

        <div class="checkbox-group">
            <label><input type="checkbox" id="checkMetar" checked> METAR</label>
            <label><input type="checkbox" id="checkTaf"> TAF</label>
        </div>

        <div class="btn-group">
            <button class="btn-load" onclick="fetchData(false)">Cargar</button>
            <button class="btn-raw" onclick="fetchData(true)">Raw</button>
        </div>
    </div>

    <div id="output">// Los datos aparecerán aquí...</div>
    <div id="urlDisplay" class="url-debug"></div>
</div>

<script>
    async function fetchData(isRawMode) {
        const icao = document.getElementById('icao').value.trim().toUpperCase();
        const hours = document.getElementById('hours').value;
        const metarActive = document.getElementById('checkMetar').checked;
        const tafActive = document.getElementById('checkTaf').checked;
        const output = document.getElementById('output');
        const urlDisplay = document.getElementById('urlDisplay');

        if (!icao) {
            alert("Por favor, introduce un código ICAO.");
            return;
        }

        // Construcción de la URL según lógica solicitada
        // Nota: La API requiere IDs. Si METAR está off pero TAF on, la lógica de la URL cambia.
        // Aquí seguimos tu regla: taf=true si el check TAF está activo.
        const baseUrl = "https://aviationweather.gov/api/data/metar";
        const url = `${baseUrl}?ids=${icao}&format=raw&taf=${tafActive}&hours=${hours}`;
        
        urlDisplay.innerText = `Query URL: ${url}`;
        output.innerText = "Cargando...";

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("Error en la respuesta del servidor");
            
            const data = await response.text();
            
            if (isRawMode) {
                // En modo Raw mostramos el contenido tal cual
                output.innerText = data || "No se encontraron datos.";
            } else {
                // En modo Cargar podríamos dar un formato extra o simplemente limpiar
                output.innerText = data.trim() ? data : "Sin información disponible para este reporte.";
            }
        } catch (error) {
            output.innerText = "Error: " + error.message;
        }
    }
</script>

</body>
</html>
