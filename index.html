<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviation Weather Tool</title>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 800px;
        }

        h2 { margin-top: 0; color: var(--primary); font-weight: 600; }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        input[type="text"], select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }

        input[type="text"] { width: 120px; text-transform: uppercase; }

        .checkbox-group {
            display: flex;
            gap: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #1d4ed8; }
        
        .btn-secondary { background: #64748b; color: white; }
        .btn-secondary:hover { background: #475569; }

        #output {
            width: 100%;
            height: 300px;
            margin-top: 20px;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #27272a;
            color: #10b981;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: vertical;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Consulta Meteorológica Aeronáutica</h2>
    
    <div class="toolbar">
        <input type="text" id="icao" placeholder="Ej: GCXO" maxlength="4">

        <select id="hours">
            <option value="0">Más reciente</option>
            <option value="1">Última hora</option>
            <option value="3">Últimas 3 horas</option>
            <option value="6">Últimas 6 horas</option>
            <option value="12">Últimas 12 horas</option>
            <option value="24">Últimas 24 horas</option>
        </select>

        <div class="checkbox-group">
            <label><input type="checkbox" id="checkMetar" checked> METAR</label>
            <label><input type="checkbox" id="checkTaf"> TAF</label>
        </div>

        <button class="btn-primary" onclick="fetchData()">Cargar</button>
        <button class="btn-secondary" onclick="showUrl()">Raw (URL)</button>
    </div>

    <textarea id="output" readonly placeholder="Los datos aparecerán aquí..."></textarea>
</div>

<script>
    function buildUrl() {
        const icao = document.getElementById('icao').value.toUpperCase().trim();
        const hours = document.getElementById('hours').value;
        const tafActive = document.getElementById('checkTaf').checked;
        const metarActive = document.getElementById('checkMetar').checked;

        if (!icao) {
            alert("Por favor, introduce un código ICAO.");
            return null;
        }

        // Si METAR no está marcado pero TAF sí, la API requiere ajustes, 
        // pero siguiendo tu lógica de ejemplo:
        return `https://aviationweather.gov/api/data/metar?ids=${icao}&format=raw&taf=${tafActive}&hours=${hours}`;
    }

    async function fetchData() {
        const url = buildUrl();
        if (!url) return;

        const output = document.getElementById('output');
        output.value = "Cargando...";

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error("Error en la respuesta del servidor");
            const data = await response.text();
            output.value = data || "No se encontraron datos para esta consulta.";
        } catch (error) {
            output.value = "Error: " + error.message;
        }
    }

    function showUrl() {
        const url = buildUrl();
        if (url) {
            document.getElementById('output').value = "URL de la consulta:\n" + url;
        }
    }
</script>

</body>
</html>
